<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llavero encontrado</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f6; margin: 0;
         display: flex; justify-content: center; padding: 24px; }
  .card { background: #fff; max-width: 420px; width: 100%; border-radius: 16px;
          padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: #444; line-height: 1.4; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; padding: 14px;
          margin-top: 12px; border: 0; border-radius: 12px; font-size: 1rem;
          font-weight: 600; text-decoration: none; cursor: pointer; }
  #avisar { background: #1a73e8; color: #fff; }
  .wa { background: #25d366; color: #fff; }
  .tel { background: #eee; color: #222; }
  #estado { margin-top: 14px; font-size: .95rem; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Encontraste unas llaves</h1>
  <p>¡Gracias por ayudar! Tocá el botón para avisarle al dueño dónde están.
     Solo se comparte la ubicación del momento.</p>

  <button id="avisar">📍 Avisar al dueño dónde estoy</button>
  <div id="estado"></div>

  <a class="btn wa" id="wa" href="#">💬 Escribir por WhatsApp</a>
  <a class="btn tel" id="tel" href="#">📞 Llamar al dueño</a>
</div>

<script>
  // ==== CONFIGURAR ====
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx92GgVQxPr-t5j9VJhi3CdeYurfeObpIFS7_RneH5x_Mm2xX1ZiwwAdjz2Npi7M6XQAA/exec';
  const TELEFONO = '5491168303450'; // 54 + 9 + código de área + número, sin 0 ni 15
  const NOMBRE_DUENO = 'Agustín';
  // =====================

  const id = new URLSearchParams(location.search).get('id') || 'sin-id';
  const estado = document.getElementById('estado');
  const btn = document.getElementById('avisar');

  const msg = encodeURIComponent('Hola ' + NOMBRE_DUENO + ', encontré tu llavero (' + id + ').');
  document.getElementById('wa').href = 'https://wa.me/' + TELEFONO + '?text=' + msg;
  document.getElementById('tel').href = 'tel:+' + TELEFONO;

  btn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      estado.textContent = 'Tu navegador no permite ubicación. Usá WhatsApp o llamá.';
      return;
    }
    btn.disabled = true;
    estado.textContent = 'Obteniendo ubicación...';

    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            id: id,
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            acc: pos.coords.accuracy
          })
        });
        estado.textContent = '✅ ¡Listo! Le avisamos al dueño. Muchas gracias.';
      } catch (e) {
        estado.textContent = 'No se pudo enviar. Probá con WhatsApp.';
        btn.disabled = false;
      }
    }, () => {
      estado.textContent = 'No pudimos obtener la ubicación. Usá WhatsApp o llamá.';
      btn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 15000 });
  });
</script>
</body>
</html>
