<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Objetos perdidos · Tito Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d;
    --card: #f6f7f9;
    --ink: #0f1b3d;
    --muted: #5b6478;
    --label: #8a92a3;
    --blue: #1e88e5;
    --green: #1fb356;
    --green-dark: #16803c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1b1e26 0%, var(--bg) 62%);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(32px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  .logo {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: #1c1f26;
    margin-bottom: 22px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border-radius: 16px;
    padding: 26px 22px 22px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  }

  .eyebrow {
    margin: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--label);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
  }
  .divider::before { background: linear-gradient(90deg, transparent, #b9d5f1); }
  .divider::after  { background: linear-gradient(270deg, transparent, #b9d5f1); }

  h1 {
    margin: 0 0 10px;
    font-size: 25px;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
  }

  .texto {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .estado {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    margin: 16px 0 4px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
  }
  .estado .ico { flex: none; width: 22px; height: 22px; display: block; }
  .estado.info { background: #e9eef6; color: #3b4a66; }
  .estado.ok   { background: #e3f3ea; color: var(--green-dark); }
  .estado.warn { background: #fdf1dc; color: #8f5c00; }
  .estado.err  { background: #fbe6e6; color: #a12a2a; }

  .spin {
    width: 18px; height: 18px; margin: 2px;
    border: 2.5px solid #b7c2d6;
    border-top-color: #3b4a66;
    border-radius: 50%;
    animation: giro .8s linear infinite;
  }
  @keyframes giro { to { transform: rotate(360deg); } }

  .acciones { margin-top: 10px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 46px;
    margin-top: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
  }
  .btn svg { width: 19px; height: 19px; flex: none; }
  .btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .wa  { background: var(--green); color: #fff; }
  .tel { background: #f1f2f5; color: #1b2440; border: 1px solid #d9dce3; }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation-duration: 2.4s; }
  }
</style>
</head>
<body>

  <!-- Subí tu logo al repositorio con el nombre logo.png (misma carpeta que este archivo) -->
  <img class="logo" src="logo.png" alt="Tito Print" onerror="this.style.display='none'">

  <main class="card">
    <p class="eyebrow">Tito Print · Objetos perdidos</p>

    <div class="divider" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1e88e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
    </div>

    <h1>¿Encontraste unas llaves?</h1>
    <p class="texto">
      ¡Gracias por ayudar! Si tu celular te pide permiso para compartir tu ubicación,
      aceptalo para avisarle al dueño dónde están. Solo se comparte la ubicación en este momento.
    </p>

    <div id="estado" class="estado info" role="status" aria-live="polite"></div>

    <div class="acciones">
      <a class="btn wa" id="wa" href="#" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        Escribir por WhatsApp
      </a>
      <a class="btn tel" id="tel" href="#" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1b2440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Llamar al dueño
      </a>
    </div>
  </main>

<script>
  // ==== CONFIGURAR ====
  const SCRIPT_URL = 'PEGAR_AQUI_LA_URL_DE_APPS_SCRIPT/exec';
  // =====================

  const id = new URLSearchParams(location.search).get('id') || '';
  const estado = document.getElementById('estado');
  const wa = document.getElementById('wa');
  const tel = document.getElementById('tel');

  const ICONOS = {
    ok:   '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1fb356"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#5b6b8c"/><path d="M12 11v5.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.4" fill="#fff"/></svg>',
    warn: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#e0a100"/><path d="M12 6.5v6.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.4" fill="#fff"/></svg>',
    err:  '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#d64545"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
    carga:'<span class="spin" aria-hidden="true"></span>'
  };

  // tipo: ok | info | warn | err | carga
  function setEstado(tipo, texto) {
    estado.className = 'estado ' + (tipo === 'carga' ? 'info' : tipo);
    estado.innerHTML = ICONOS[tipo] + '<span></span>';
    estado.lastChild.textContent = texto;
  }

  let enviadoSinUbic = false;
  let enviadoConUbic = false;

  function enviar(pos) {
    const datos = { id: id };
    if (pos) {
      datos.lat = pos.coords.latitude;
      datos.lng = pos.coords.longitude;
      datos.acc = pos.coords.accuracy;
    }
    return fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(datos)
    });
  }

  function avisarAlDueno() {
    setEstado('carga', 'Avisando al dueño...');

    function avisarSinUbicacion() {
      if (enviadoSinUbic || enviadoConUbic) return;
      enviadoSinUbic = true;
      enviar(null);
      setEstado('info', 'Le avisamos al dueño que encontraste sus llaves. Podés escribirle o llamarlo con los botones de abajo.');
    }

    if (!navigator.geolocation) { avisarSinUbicacion(); return; }

    // Si no responde al cartel de ubicación, avisamos igual a los 20 segundos
    const timer = setTimeout(avisarSinUbicacion, 20000);

    navigator.geolocation.getCurrentPosition(pos => {
      clearTimeout(timer);
      enviadoConUbic = true;
      enviar(pos);
      setEstado('ok', 'Le avisamos al dueño dónde están las llaves. ¡Muchas gracias!');
    }, () => {
      clearTimeout(timer);
      avisarSinUbicacion();
    }, { enableHighAccuracy: true, timeout: 30000 });
  }

  if (!id) {
    setEstado('err', 'El link del llavero no es válido.');
  } else {
    setEstado('carga', 'Cargando...');
    fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id))
      .then(r => r.json())
      .then(d => {
        if (!d.ok) {
          setEstado('err', 'Este llavero no está registrado.');
          return;
        }
        const msg = encodeURIComponent('Hola ' + d.nombre + ', encontré tu llavero.');
        wa.href = 'https://wa.me/' + d.tel + '?text=' + msg;
        tel.href = 'tel:+' + d.tel;
        wa.style.display = 'flex';
        tel.style.display = 'flex';
        avisarAlDueno();
      })
      .catch(() => {
        setEstado('err', 'No se pudieron cargar los datos. Probá de nuevo.');
      });
  }
</script>
</body>
</html>
