<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llavero encontrado</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f6; margin: 0;
         display: flex; justify-content: center; padding: 24px; }
  .card { background: #fff; max-width: 420px; width: 100%; border-radius: 16px;
          padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: #444; line-height: 1.4; }
  a.btn { display: block; box-sizing: border-box; padding: 14px; margin-top: 12px;
          border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; }
  .wa { background: #25d366; color: #fff; }
  .tel { background: #eee; color: #222; }
  #estado { margin-top: 14px; font-size: .95rem; color: #222; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Encontraste unas llaves</h1>
  <p>¡Gracias por ayudar! Si tu celular te pide permiso para usar tu ubicación,
     aceptarlo le avisa al dueño dónde están. Solo se comparte la ubicación de este momento.</p>

  <div id="estado">Cargando...</div>

  <a class="btn wa" id="wa" href="#">💬 Escribir por WhatsApp</a>
  <a class="btn tel" id="tel" href="#">📞 Llamar al dueño</a>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx92GgVQxPr-t5j9VJhi3CdeYurfeObpIFS7_RneH5x_Mm2xX1ZiwwAdjz2Npi7M6XQAA/exec';

  const id = new URLSearchParams(location.search).get('id') || '';
  const estado = document.getElementById('estado');
  const wa = document.getElementById('wa');
  const tel = document.getElementById('tel');
  wa.style.display = 'none';
  tel.style.display = 'none';

  let enviadoSinUbic = false;
  let enviadoConUbic = false;

  function enviar(pos) {
    const datos = { id: id };
    if (pos) {
      datos.lat = pos.coords.latitude;
      datos.lng = pos.coords.longitude;
      datos.acc = pos.coords.accuracy;
    }
    return fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(datos)
    });
  }

  function avisarAlDueno() {
    estado.textContent = 'Avisando al dueño...';

    function avisarSinUbicacion() {
      if (enviadoSinUbic || enviadoConUbic) return;
      enviadoSinUbic = true;
      enviar(null);
      estado.textContent = 'Le avisamos al dueño que encontraste sus llaves. ' +
                           'Podés escribirle o llamarlo con los botones de abajo.';
    }

    if (!navigator.geolocation) { avisarSinUbicacion(); return; }

    // Si no responde al cartel de ubicación, avisamos igual a los 20 segundos
    const timer = setTimeout(avisarSinUbicacion, 20000);

    navigator.geolocation.getCurrentPosition(pos => {
      clearTimeout(timer);
      enviadoConUbic = true;
      enviar(pos);
      estado.textContent = '✅ Le avisamos al dueño dónde están las llaves. ¡Muchas gracias!';
    }, () => {
      clearTimeout(timer);
      avisarSinUbicacion();
    }, { enableHighAccuracy: true, timeout: 30000 });
  }

  if (!id) {
    estado.textContent = 'Link inválido.';
  } else {
    fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id))
      .then(r => r.json())
      .then(d => {
        if (!d.ok) {
          estado.textContent = 'Este llavero no está registrado.';
          return;
        }
        const msg = encodeURIComponent('Hola ' + d.nombre + ', encontré tu llavero.');
        wa.href = 'https://wa.me/' + d.tel + '?text=' + msg;
        tel.href = 'tel:+' + d.tel;
        wa.style.display = 'block';
        tel.style.display = 'block';
        avisarAlDueno();
      })
      .catch(() => {
        estado.textContent = 'No se pudieron cargar los datos. Probá de nuevo.';
      });
  }
</script>
</body>
</html>
